templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'main_receiver'
  group_by: ['alertname', 'job', 'severity', 'service', 'monitor']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - receiver: 'urgent_receiver'
      matchers:
        - severity="Critical"
    - receiver: 'telegram_receiver'
      matchers:
        - channel="telegram"
    - receiver: 'discord_receiver'
      matchers:
        - channel="discord"
    # - receiver: 'outlook_receiver'
    #   matchers:
    #     - channel="outlook"

