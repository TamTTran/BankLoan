# docker-compose.override.yml
# ──────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT override:
#   - MySQL runs in Docker (port 3306 exposed to host)
#   - API & Frontend run outside Docker (VS / npm run dev) → NOT in containers
#
# Usage:
#   Start DB only:        docker compose up db -d
#   Start full stack:     docker compose --profile full up --build
# ──────────────────────────────────────────────────────────────────────────────

name: loanflow

services:
  db:
    ports:
      - "3306:3306"    # Expose to localhost so VS can connect directly
    environment:
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"

  # API runs in Visual Studio / dotnet watch locally — disable container version
  api:
    profiles:
      - full            # Only start when: docker compose --profile full up
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # Enables Swagger, hot-reload logs

  # Frontend runs via: cd frontend && npm run dev
  frontend:
    profiles:
      - full
