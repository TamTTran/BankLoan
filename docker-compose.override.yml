# docker-compose.override.yml
# ──────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT override:
#   - MySQL runs in Docker (port 3306 exposed to host)
#   - API & Frontend run outside Docker (VS / npm run dev) → NOT in containers
#
# Usage:
#   Start DB only:        docker compose up db -d
#   Start full stack:     docker compose --profile full up --build
# ──────────────────────────────────────────────────────────────────────────────

name: loanflow

services:
  db:
    ports:
      - "3306:3306"    # Expose to localhost so VS can connect directly
    environment:
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"

  # API runs in Visual Studio / dotnet watch locally — disable container version
  api:
    profiles:
      - full            # Only start when: docker compose --profile full up
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # Enables Swagger, hot-reload logs
      ExternalServices__UseMockPaymentGateway: "true"
      ExternalServices__UseMockSms: "true"
      ExternalServices__UseMockCic: "true"
      ExternalServices__UseMockEkyc: "true"
      ExternalServices__UseMockCertificateAuthority: "true"
      Cors__AllowedOrigins__0: "http://localhost"
      Cors__AllowedOrigins__1: "https://localhost"
      AllowedHosts: "localhost;127.0.0.1;api;loanflow-api"

  # Frontend runs via: cd frontend && npm run dev
  frontend:
    profiles:
      - full

  # Prometheus scrapes the containerized API, so keep it with the full stack.
  prometheus:
    profiles:
      - full

  # Grafana reads Prometheus, so keep it with the full stack.
  grafana:
    profiles:
      - full
