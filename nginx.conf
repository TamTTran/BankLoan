map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    "" $request_id;
}

log_format loanflow_gateway escape=json
    '{"time":"$time_iso8601","requestId":"$correlation_id","remoteAddr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"requestTime":$request_time,"upstreamTime":"$upstream_response_time",'
    '"upstreamStatus":"$upstream_status","bytesSent":$bytes_sent,'
    '"userAgent":"$http_user_agent"}';

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

server {
    listen 8081;
    server_name _;

    access_log off;
    server_tokens off;

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    location /health {
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}

server {
    listen 80;
    server_name localhost loanflow.local;

    server_tokens off;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost loanflow.local;

    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream https://api:8443;

    access_log /var/log/nginx/access.log loanflow_gateway;

    ssl_certificate     /etc/nginx/certs/nginx-server.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn addr_conn 100;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 413 = @payload_too_large;
    error_page 429 = @rate_limited;

    root /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control          "public, immutable";
        add_header X-Request-ID           $correlation_id always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    location @payload_too_large {
        internal;
        default_type application/json;
        add_header X-Request-ID $correlation_id always;
        return 413 '{"success":false,"error":{"code":"REQUEST_TOO_LARGE","message":"Request body exceeds gateway limit."}}';
    }

    location @rate_limited {
        internal;
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-Request-ID $correlation_id always;
        return 429 '{"success":false,"error":{"code":"GATEWAY_RATE_LIMITED","message":"Too many requests."}}';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Request-ID           $correlation_id always;
        add_header Cache-Control          "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # SignalR WebSocket — must be before generic /api/ block
    location = /api/live {
        access_log off;
        default_type application/json;
        add_header X-Request-ID $correlation_id always;
        return 200 '{"success":true,"status":"alive","source":"gateway"}';
    }

    location /api/hubs/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_conn addr_conn 50;

        proxy_pass            $api_upstream;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $connection_upgrade;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_set_header      X-Request-ID      $correlation_id;
        proxy_set_header      X-Correlation-ID  $correlation_id;
        proxy_read_timeout    3600s;
        proxy_connect_timeout 10s;

        proxy_ssl_certificate         /etc/nginx/certs/nginx-client.crt;
        proxy_ssl_certificate_key     /etc/nginx/certs/nginx-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_name                api;
        proxy_ssl_server_name         on;
    }

    location /api/auth/ {
        limit_req zone=auth_per_ip nodelay;
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_conn addr_conn 20;

        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Request-ID      $correlation_id;
        proxy_set_header   X-Correlation-ID  $correlation_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        proxy_ssl_certificate         /etc/nginx/certs/nginx-client.crt;
        proxy_ssl_certificate_key     /etc/nginx/certs/nginx-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_name                api;
        proxy_ssl_server_name         on;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=50 nodelay;
        limit_conn addr_conn 50;

        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Request-ID      $correlation_id;
        proxy_set_header   X-Correlation-ID  $correlation_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        proxy_ssl_certificate         /etc/nginx/certs/nginx-client.crt;
        proxy_ssl_certificate_key     /etc/nginx/certs/nginx-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_name                api;
        proxy_ssl_server_name         on;
    }

    location /swagger/ {
        return 404;
    }
}
