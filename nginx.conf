server {
    listen 80;
    server_name localhost;

    # ─── Hide Nginx version ──────────────────────────────────────────────────
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers (server-level — inherited only if location has NO add_header) ───
    # NOTE: Because sub-locations use add_header, we must repeat these in each location.
    # This is a known Nginx inheritance quirk.

    # ─── Gzip Compression ───────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # ─── Static Asset Caching ───────────────────────────────────────────────
    # Vite outputs hashed filenames → safe to cache 1 year
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control          "public, immutable";
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # ─── SPA Fallback ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control          "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ─── Docker Health Check endpoint ───────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ─── API Proxy → LoanFlow API container ─────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ─── Swagger — BLOCKED in production ──────────────────────────────────
    # Access Swagger only via direct API port (localhost:8080/swagger)
    # in Development mode. Never expose through the public Nginx proxy.
    location /swagger/ {
        return 404;
    }
}
