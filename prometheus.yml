global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'loanflow-api'
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /certs/ca.crt
      server_name: api
    static_configs:
      - targets: ['api:8443']

  - job_name: 'loanflow-gateway'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'loanflow-node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'loanflow-db'
    static_configs:
      - targets: ['mysql-exporter:9104']

  - job_name: 'loanflow-windows'
    metrics_path: /metrics
    scrape_timeout: 10s
    params:
      collect[]:
        - cpu
        - logical_disk
        - memory
        - net
        - os
        - physical_disk
        - service
        - system
    static_configs:
      - targets: ['host.docker.internal:9182']
        labels:
          host: 'windows-host'
          exporter: 'windows_exporter'
