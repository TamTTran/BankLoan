global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'loanflow-api'
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /certs/ca.crt
      server_name: api
    static_configs:
      - targets: ['api:8443']

  - job_name: 'loanflow-gateway'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'loanflow-node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'loanflow-windows'
    static_configs:
      - targets: ['host.docker.internal:9182']
