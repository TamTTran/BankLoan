name: loanflow

services:

  # ────────────────────────────────────────────────────
  # SQL Server 2022
  # ────────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: loanflow-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:-LoanFlow@2026!}"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_SA_PASSWORD:-LoanFlow@2026!}\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────
  # LoanFlow API  (.NET 8)
  # ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loanflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;Database=LoanFlowLite;
        User Id=sa;Password=${DB_SA_PASSWORD:-LoanFlow@2026!};
        TrustServerCertificate=True;
      Jwt__Key: "${JWT_KEY:-LoanFlow-Super-Secret-Key-2026-Min32Chars!!}"
      Jwt__Issuer: "LoanFlow.API"
      Jwt__Audience: "LoanFlow.Client"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/swagger/index.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ────────────────────────────────────────────────────
  # Frontend (Nginx static file server)
  # ────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: loanflow-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sqldata:
    name: loanflow-sqldata
