name: loanflow

services:

  # ────────────────────────────────────────────────────
  # MySQL 8 — Persistent database
  # ────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: loanflow-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: LoanFlowLite
      MYSQL_USER: loanflow
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    expose:
      - "3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "loanflow", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ────────────────────────────────────────────────────
  # LoanFlow API  (.NET 8)
  # ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: loanflow-api:latest
    container_name: loanflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"   # HTTP  — Swagger UI: http://localhost:8080/swagger
      - "8443:8443"   # HTTPS — Direct API:  https://localhost:8443/api
    volumes:
      - ./certs:/certs:ro    # C9: Mount internal CA certs
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+:8443;http://+:8080
      ASPNETCORE_Kestrel__Certificates__Default__Path: /certs/api.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /certs/api.key
      DOTNET_RUNNING_IN_CONTAINER: "true"
      ConnectionStrings__DefaultConnection: >-
        Server=db;Port=3306;Database=LoanFlowLite;
        User=loanflow;Password=${DB_PASSWORD};
        CharSet=utf8mb4;AllowPublicKeyRetrieval=true;SslMode=Required
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "LoanFlow.API"
      Jwt__Audience: "LoanFlow.Client"
      AllowedHosts: "${ALLOWED_HOSTS:-loanflow.local}"
      # ── Seed passwords (fixed for local dev/test) ────────────────────────────
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-LoanFlow@2026!}"
      SEED_OFFICER_PASSWORD: "${SEED_OFFICER_PASSWORD:-LoanFlow@2026!}"
      SEED_APPROVER_PASSWORD: "${SEED_APPROVER_PASSWORD:-LoanFlow@2026!}"
      SEED_COLLECTOR_PASSWORD: "${SEED_COLLECTOR_PASSWORD:-LoanFlow@2026!}"
      SEED_MANAGER_PASSWORD: "${SEED_MANAGER_PASSWORD:-LoanFlow@2026!}"
      Cors__AllowedOrigins__0: "${PUBLIC_APP_ORIGIN:-https://loanflow.local}"
      Webhook__Secret: "${WEBHOOK_SECRET:-SET_VIA_ENV_OR_USER_SECRETS}"
      Webhook__SystemActorUsername: "${WEBHOOK_SYSTEM_ACTOR_USERNAME:-system-webhook}"
      # BUG-003: Default=true (safe mock) — production .env overrides to false
      ExternalServices__UseMockPaymentGateway: "${USE_MOCK_PAYMENT_GATEWAY:-true}"
      ExternalServices__UseMockSms: "${USE_MOCK_SMS:-true}"
      ExternalServices__UseMockCic: "${USE_MOCK_CIC:-true}"
      ExternalServices__UseMockEkyc: "${USE_MOCK_EKYC:-true}"
      ExternalServices__UseMockCertificateAuthority: "${USE_MOCK_CERTIFICATE_AUTHORITY:-true}"
      ExternalServices__NapasApiUrl: "${NAPAS_API_URL:-SET_VIA_KEYVAULT}"
      ExternalServices__NapasApiKey: "${NAPAS_API_KEY:-SET_VIA_KEYVAULT}"
      ExternalServices__PcbApiUrl: "${PCB_API_URL:-SET_VIA_KEYVAULT}"
      ExternalServices__PcbApiKey: "${PCB_API_KEY:-SET_VIA_KEYVAULT}"
      ExternalServices__FptEkycApiUrl: "${FPT_EKYC_API_URL:-SET_VIA_KEYVAULT}"
      ExternalServices__FptEkycApiKey: "${FPT_EKYC_API_KEY:-SET_VIA_KEYVAULT}"
      ExternalServices__CertificateAuthorityApiUrl: "${CERTIFICATE_AUTHORITY_API_URL:-SET_VIA_KEYVAULT}"
      ExternalServices__CertificateAuthorityApiKey: "${CERTIFICATE_AUTHORITY_API_KEY:-SET_VIA_KEYVAULT}"
      Twilio__AccountSid: "${TWILIO_ACCOUNT_SID:-SET_VIA_KEYVAULT}"
      Twilio__AuthToken: "${TWILIO_AUTH_TOKEN:-SET_VIA_KEYVAULT}"
      Twilio__FromNumber: "${TWILIO_FROM_NUMBER:-SET_VIA_KEYVAULT}"
      ForwardedHeaders__KnownProxies__0: "${TRUSTED_PROXY_IP:-}"
      # Daily overdue background job (UTC+7 = 01:00 UTC)
      BackgroundJobs__DailyOverdue__RunHourUtc: "18"
      BackgroundJobs__DailyOverdue__RunMinuteUtc: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ────────────────────────────────────────────────────
  # Frontend (React + Vite → Nginx)
  # Build context is repo root to access nginx.conf
  # ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: loanflow-frontend:latest
    container_name: loanflow-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro  # TLS for browser traffic and mTLS to API
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m

  # ────────────────────────────────────────────────────
  # Prometheus Metrics
  # ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: loanflow-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    expose:
      - "9090"
    depends_on:
      - api

  # ────────────────────────────────────────────────────
  # Ofelia — DB Backup Scheduler (H7)
  # Runs backup.sh daily at 02:00 UTC (09:00 ICT)
  # ────────────────────────────────────────────────────
  backup-scheduler:
    image: mcuadros/ofelia:latest
    container_name: loanflow-backup-scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts:/scripts:ro
      - loanflow-backups:/backups
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
    command: daemon --docker
    labels:
      ofelia.job-run.db-backup.schedule: "0 2 * * *"
      ofelia.job-run.db-backup.image: "mysql:8.4"
      ofelia.job-run.db-backup.network: "loanflow_default"
      ofelia.job-run.db-backup.environment: "DB_PASSWORD=${DB_PASSWORD}"
      ofelia.job-run.db-backup.volume: "/scripts:/scripts:ro,loanflow-backups:/backups"
      ofelia.job-run.db-backup.command: "sh /scripts/backup.sh"


volumes:
  mysqldata:
    name: loanflow-mysqldata
  loanflow-backups:
    name: loanflow-backups    # H7: Named volume for persistent DB backups
