name: loanflow

services:

  # ────────────────────────────────────────────────────
  # MySQL 8
  # ────────────────────────────────────────────────────
  db:
    image: mysql:8
    container_name: loanflow-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: LoanFlowLite
      MYSQL_USER: loanflow
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "loanflow", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────
  # LoanFlow API  (.NET 8)
  # ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loanflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=db;Port=3306;Database=LoanFlowLite;
        User=loanflow;Password=${DB_PASSWORD};
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "LoanFlow.API"
      Jwt__Audience: "LoanFlow.Client"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ────────────────────────────────────────────────────
  # Frontend (React + Vite → Nginx)
  # ────────────────────────────────────────────────────
  frontend:
    build:
      context: .                         # root để access nginx.conf
      dockerfile: frontend/Dockerfile
    container_name: loanflow-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"


volumes:
  mysqldata:
    name: loanflow-mysqldata
